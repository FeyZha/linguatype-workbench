<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LinguaType · 雅思表达支架工作台</title>
  <style>
    :root {
      --bg: oklch(0.9818 0.0054 95.10);
      --surface: oklch(0.9880 0.0041 91.45);
      --fg: oklch(0.1908 0.0020 106.59);
      --muted: oklch(0.5242 0.0096 91.56);
      --border: oklch(0.9072 0.0122 67.67);
      --accent: oklch(0.5518 0.1133 38.46);
      --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--surface));
      --fg-soft: color-mix(in oklch, var(--fg) 5%, var(--surface));
      --shadow: 0 16px 50px color-mix(in oklch, var(--fg) 8%, transparent);
      --font-display: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", STSong, serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --radius: 10px;
      --radius-lg: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.55 var(--font-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
    p { text-wrap: pretty; }
    a { color: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    :focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    .app-shell { min-height: 100vh; }
    .topnav {
      position: sticky; top: 0; z-index: 20;
      min-height: 64px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 94%, transparent);
      backdrop-filter: blur(14px);
    }
    .topnav-inner {
      max-width: 1600px; min-height: 64px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .brand-lockup { display: inline-flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 9px; background: var(--fg); color: var(--surface);
      font: italic 21px/1 var(--font-display);
    }
    .brand-copy { display: grid; line-height: 1.15; }
    .brand-copy strong { font-family: var(--font-display); font-size: 18px; }
    .brand-copy span { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .top-context { min-width: 0; text-align: center; }
    .top-context span { display: block; color: var(--muted); font-size: 11px; }
    .top-context strong {
      display: block; max-width: 42ch; margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font: 500 13px/1.3 var(--font-body);
    }
    .mobile-switch {
      display: none; position: sticky; top: 64px; z-index: 15;
      grid-template-columns: repeat(3, 1fr); padding: 8px 16px;
      border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .mobile-switch button {
      min-height: 44px; border: 1px solid var(--border); background: var(--surface);
    }
    .mobile-switch button:first-child { border-radius: 9px 0 0 9px; }
    .mobile-switch button + button { border-left: 0; }
    .mobile-switch button:last-child { border-radius: 0 9px 9px 0; }
    .mobile-switch button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

    .workspace-grid {
      max-width: 1600px; min-height: calc(100vh - 64px); margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 224px minmax(560px, 1fr) 404px; gap: 16px;
      align-items: start;
    }
    .pane {
      min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface);
    }
    .library-pane, .support-pane {
      position: sticky; top: 88px; max-height: calc(100vh - 112px); overflow: auto;
    }
    .library-pane { padding: 14px; }
    .library-pane .pane-heading { display: block; }
    .pane-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow {
      margin-bottom: 3px; color: var(--muted);
      font: 11px/1.2 var(--font-mono); letter-spacing: .06em;
    }
    .pane-heading h2 { font-size: 21px; font-weight: 600; letter-spacing: -.015em; }
    .icon-button {
      min-width: 44px; min-height: 44px; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
    }
    .icon-button:hover { border-color: var(--fg); background: var(--fg-soft); }
    .btn {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border: 1px solid transparent; border-radius: 9px;
      font-weight: 650; transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: color-mix(in oklch, var(--accent) 88%, var(--fg)); }
    .btn-dark { background: var(--fg); color: var(--surface); border-color: var(--fg); }
    .btn-dark:hover:not(:disabled) { background: color-mix(in oklch, var(--fg) 88%, var(--surface)); }
    .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--fg); background: var(--fg-soft); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
    .btn-ghost:hover:not(:disabled) { background: var(--fg-soft); }
    .new-essay { width: 100%; margin: 14px 0; }
    .document-list { display: grid; gap: 6px; }
    .document-item {
      width: 100%; min-height: 68px; padding: 10px; display: grid; gap: 4px;
      border: 1px solid transparent; border-radius: 10px; background: transparent; text-align: left;
    }
    .document-item:hover { background: var(--fg-soft); }
    .document-item[aria-current="true"] {
      border-color: var(--fg); background: var(--surface);
      box-shadow: inset 3px 0 0 var(--fg);
    }
    .document-item span { color: var(--muted); font: 10px/1.2 var(--font-mono); }
    .document-item strong {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font: 600 13px/1.3 var(--font-body);
    }
    .document-item small { color: var(--muted); font-size: 11px; }
    .library-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    }
    .library-actions .btn { min-width: 0; padding-inline: 8px; font-size: 12px; }
    .archive-drawer { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .archive-drawer summary { min-height: 44px; padding: 12px 4px; cursor: pointer; color: var(--muted); font-weight: 650; }
    .archive-list { display: grid; gap: 7px; }
    .archive-row { padding: 10px; border: 1px solid var(--border); border-radius: 9px; }
    .archive-row strong { display: block; font-size: 12px; }
    .archive-row div { display: flex; gap: 6px; margin-top: 8px; }
    .archive-row .btn { min-height: 44px; padding: 8px 9px; font-size: 11px; }

    .writing-pane { min-height: calc(100vh - 112px); overflow: hidden; }
    .writing-header { padding: 28px 32px 22px; border-bottom: 1px solid var(--border); }
    .writing-header h1 { max-width: 22ch; font-size: clamp(28px, 3vw, 42px); font-weight: 500; line-height: 1.12; }
    .writing-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .ownership-note { max-width: 28ch; color: var(--muted); font-size: 12px; text-align: right; }
    .writing-form { padding: 24px 32px 30px; }
    .field { display: grid; gap: 8px; }
    .field + .field { margin-top: 22px; }
    .field-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .field label { font-weight: 700; font-size: 13px; }
    .field-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 11px/1.3 var(--font-mono); }
    .source-meta { min-height: 26px; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .tag {
      display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    }
    .input, .textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 11px;
      background: var(--surface); color: var(--fg); outline: none;
    }
    .input { min-height: 96px; padding: 14px 16px; resize: vertical; line-height: 1.6; }
    .textarea {
      min-height: 360px; padding: 24px; resize: vertical;
      font: 18px/1.75 var(--font-display); letter-spacing: .003em;
    }
    .input:hover, .textarea:hover { border-color: color-mix(in oklch, var(--fg) 32%, var(--border)); }
    .input:focus, .textarea:focus { border-color: var(--fg); box-shadow: 0 0 0 3px var(--fg-soft); }

    .detection-panel { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 20px; }
    .detection-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .detection-header h2 { font-size: 20px; }
    .detection-header p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status-label { color: var(--muted); font: 11px/1.3 var(--font-mono); white-space: nowrap; }
    .sentence-list { display: grid; gap: 8px; margin-top: 14px; }
    .sentence-card {
      padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
      border: 1px solid var(--border); border-radius: 11px; background: var(--surface);
    }
    .sentence-card.current { border-color: var(--fg); }
    .sentence-card span { color: var(--muted); font: 10px/1.2 var(--font-mono); }
    .sentence-card p { margin-top: 5px; font: 15px/1.6 var(--font-display); overflow-wrap: anywhere; }
    .sentence-card .btn { min-width: 118px; font-size: 12px; }
    .empty-state {
      margin-top: 14px; padding: 26px; border: 1px dashed var(--border); border-radius: 11px;
      color: var(--muted); text-align: center;
    }
    .empty-state strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; }
    .empty-state p { margin-top: 5px; font-size: 12px; }

    .support-pane { min-height: calc(100vh - 112px); }
    .support-header {
      position: sticky; top: 0; z-index: 2; padding: 20px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .support-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .support-header h2 { font-size: 23px; }
    .target-sentence {
      margin-top: 16px; padding: 15px 0 18px; border-block: 1px solid var(--fg);
      font: 500 18px/1.55 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere;
    }
    .target-sentence span {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
      color: var(--fg); font: 650 10px/1.2 var(--font-mono); letter-spacing: .08em;
    }
    .target-sentence span::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .support-document { display: block; margin-top: 12px; color: var(--muted); font-size: 11px; }
    .support-document[hidden] { display: none; }
    .history { padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .history-label { display: flex; justify-content: space-between; color: var(--muted); font: 10px/1.2 var(--font-mono); }
    .history-list { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; padding-bottom: 2px; }
    .history-tab {
      min-width: 116px; min-height: 44px; padding: 8px 9px;
      border: 1px solid var(--border); border-radius: 9px; background: var(--surface); text-align: left;
    }
    .history-tab[aria-current="true"] { border-color: var(--fg); background: var(--fg-soft); }
    .history-tab strong { display: block; font-size: 11px; }
    .history-tab span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .support-content { padding: 20px; }
    .loading-card, .error-card {
      padding: 18px; display: grid; grid-template-columns: 30px 1fr; gap: 13px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--fg-soft);
    }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--fg);
      border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-mark {
      width: 28px; height: 28px; display: grid; place-items: center;
      border-radius: 50%; background: var(--fg); color: var(--surface); font-weight: 800;
    }
    .loading-card h3, .error-card h3 { font: 650 17px/1.3 var(--font-display); }
    .loading-card p, .error-card p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .error-card .btn { margin-top: 12px; }
    .result-stack { display: grid; gap: 12px; }
    .result-card, .feedback-card {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden;
    }
    .source-row { padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .source-row span { color: var(--muted); font: 10px/1.2 var(--font-mono); }
    .source-row p { margin-top: 4px; font: 16px/1.5 var(--font-display); }
    .direct-expression { padding: 17px 15px; }
    .direct-expression span { color: var(--muted); font-size: 11px; }
    .direct-expression strong { display: block; margin-top: 6px; font: 500 20px/1.45 var(--font-display); }
    .direct-expression p { margin-top: 7px; color: var(--muted); font-size: 11px; }
    .scaffold-intro { padding: 12px 15px 6px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
    .scaffold-list { padding: 0 10px 10px; }
    .scaffold-item {
      margin-top: 7px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--surface); overflow: hidden;
    }
    .scaffold-item:hover, .scaffold-item.revealed { border-color: var(--fg); background: var(--fg-soft); }
    .scaffold-row {
      width: 100%; min-height: 58px; padding: 11px 12px;
      display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 12px; align-items: center;
      border: 0; background: transparent; text-align: left;
    }
    .scaffold-row:hover { background: var(--fg-soft); }
    .focus-zh { font: 15px/1.45 var(--font-display); }
    .reveal-action { color: var(--muted); font-size: 12px; text-align: right; }
    .revealed-expression {
      padding: 12px; border-top: 1px solid var(--border);
      font: 500 16px/1.45 var(--font-display);
    }
    .feedback-card { padding: 15px; }
    .feedback-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .feedback-head strong { font-size: 13px; }
    .feedback-head span { color: var(--muted); font: 10px/1.3 var(--font-mono); }
    .feedback-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 12px; }
    .feedback-actions .btn.selected { border-color: var(--fg); background: var(--fg-soft); font-weight: 800; }
    .reason-field { display: grid; gap: 6px; margin-top: 12px; }
    .reason-field label { color: var(--muted); font-size: 11px; }
    .reason-field select { min-height: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
    .export-button { width: 100%; margin-top: 12px; }
    .support-reminder {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 11px; text-align: center;
    }

    dialog {
      width: min(980px, calc(100vw - 32px)); max-height: min(780px, calc(100vh - 32px));
      padding: 0; border: 1px solid var(--border); border-radius: 16px;
      background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
    }
    dialog::backdrop { background: color-mix(in oklch, var(--fg) 46%, transparent); backdrop-filter: blur(3px); }
    .dialog-header { padding: 22px 24px 18px; display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--border); }
    .dialog-header h2 { font-size: 28px; font-weight: 500; }
    .dialog-header p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .dialog-body { padding: 20px 24px 24px; overflow: auto; }
    .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .mode-tab {
      min-height: 48px; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--muted); font-weight: 700;
    }
    .mode-tab[aria-selected="true"] { border-bottom-color: var(--fg); color: var(--fg); }
    .prompt-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .82fr); gap: 18px; }
    .prompt-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
    .filter-button {
      min-height: 44px; padding: 8px 11px; flex: 0 0 auto;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    }
    .filter-button[aria-pressed="true"] { border-color: var(--fg); background: var(--fg-soft); font-weight: 800; }
    .prompt-list { max-height: 430px; display: grid; gap: 7px; overflow-y: auto; padding-right: 4px; }
    .prompt-card {
      width: 100%; min-height: 78px; padding: 11px 12px; display: grid; gap: 5px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: left;
    }
    .prompt-card:hover, .prompt-card[aria-pressed="true"] { border-color: var(--fg); background: var(--fg-soft); }
    .prompt-card span { color: var(--muted); font-size: 10px; }
    .prompt-card strong { font-size: 13px; }
    .prompt-preview { align-self: start; padding: 18px; border: 1px solid var(--border); border-radius: 12px; }
    .prompt-preview h3 { font-size: 21px; }
    .prompt-preview > p { margin: 14px 0; padding: 14px 0; border-block: 1px solid var(--border); font: 15px/1.65 var(--font-display); }
    .prompt-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .prompt-facts span { padding: 8px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 10px; }
    .prompt-preview .btn { width: 100%; }
    .custom-panel { display: grid; gap: 9px; }
    .custom-panel label { font-weight: 700; }
    .custom-panel textarea { min-height: 150px; }
    .custom-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
    .custom-actions span { color: var(--muted); font-size: 11px; }
    .delete-dialog { width: min(470px, calc(100vw - 32px)); }
    .delete-copy { padding: 22px 24px; }
    .delete-copy strong { display: block; font: 600 20px/1.35 var(--font-display); }
    .delete-copy p { margin-top: 10px; color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%);
      max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 9px;
      background: var(--fg); color: var(--surface); box-shadow: var(--shadow); font-size: 12px;
    }
    .toast[hidden] { display: none; }

    /* LinguaType reference pass: full-height archive rail, editorial canvas, quiet inspector. */
    :focus-visible { outline-color: var(--accent); }
    body { background: var(--bg); overflow: hidden; }
    .app-shell {
      height: 100vh; display: grid; grid-template-columns: 300px minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr); background: var(--bg);
    }
    .topnav {
      grid-column: 2; grid-row: 1; z-index: 40; min-height: 64px;
      border: 0; background: transparent; backdrop-filter: none; pointer-events: none;
    }
    .topnav-inner { max-width: none; min-height: 64px; padding: 0 24px; justify-content: flex-end; }
    .topnav .brand-lockup, .topnav .top-context { display: none; }
    .workspace-grid {
      grid-column: 1 / -1; grid-row: 1 / -1; z-index: 1;
      width: 100%; height: 100vh; min-height: 0; margin: 0; padding: 0;
      grid-template-columns: 320px minmax(560px, 1fr) minmax(340px, 392px);
      transition: grid-template-columns .26s cubic-bezier(.2, 0, 0, 1);
    }
    .workspace-grid.library-collapsed { grid-template-columns: 72px minmax(560px, 1fr) minmax(340px, 392px); }
    .pane { border: 0; border-radius: 0; background: transparent; }
    .library-pane, .support-pane { position: relative; top: auto; max-height: none; }
    .library-pane {
      z-index: 50; height: 100vh; padding: 28px 24px; overflow: auto;
      color: var(--fg); background: var(--bg); border-right: 1px solid var(--border);
      scrollbar-width: none; transition: padding .26s cubic-bezier(.2, 0, 0, 1);
    }
    .library-pane::-webkit-scrollbar { display: none; }
    .sidebar-brand {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 0 30px;
    }
    .sidebar-brand-lockup { min-width: 0; display: block; }
    .sidebar-wordmark { display: block; width: 240px; max-width: 100%; height: auto; user-select: none; }
    .sidebar-mark { display: none; width: 48px; height: 42px; object-fit: contain; user-select: none; }
    .sidebar-toggle {
      width: 44px; min-height: 44px; flex: 0 0 auto; display: grid; place-items: center;
      border: 0; border-radius: 6px; color: var(--muted); background: transparent;
    }
    .sidebar-toggle:hover { color: var(--fg); background: var(--fg-soft); }
    .sidebar-toggle svg { width: 16px; height: 16px; transition: transform .26s cubic-bezier(.2, 0, 0, 1); }
    .library-pane .eyebrow,
    .library-pane .document-item span,
    .library-pane .document-item small,
    .library-pane .archive-drawer summary { color: var(--muted); }
    .library-pane .pane-heading { align-items: center; }
    .library-pane .pane-heading h2 { font-family: var(--font-body); font-size: 18px; font-weight: 650; }
    .library-pane .new-essay {
      width: auto; min-height: 44px; margin: 0; padding: 8px 10px; gap: 6px;
      color: var(--fg); background: var(--fg-soft); border-color: transparent;
    }
    .library-pane .new-essay svg { width: 15px; height: 15px; }
    .document-list { margin-top: 18px; gap: 2px; }
    .document-item { min-height: 62px; padding: 9px 10px; border-radius: 6px; color: var(--muted); }
    .library-pane .document-item strong { color: var(--fg); font: 500 15px/1.35 var(--font-display); }
    .document-item:hover { color: var(--fg); background: var(--fg-soft); }
    .document-item[aria-current="true"] {
      border-color: transparent; background: var(--fg-soft); box-shadow: inset 2px 0 0 var(--fg);
    }
    .library-pane .new-essay:hover:not(:disabled) { color: var(--fg); background: color-mix(in oklch, var(--fg) 8%, var(--bg)); }
    .library-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-color: var(--border); }
    .library-actions .btn {
      min-height: 44px; padding: 0 8px; border-color: transparent;
      color: var(--muted); background: transparent; font-size: 11px; font-weight: 500;
    }
    .library-actions .btn:hover:not(:disabled) { color: var(--fg); border-color: transparent; background: var(--fg-soft); }
    .library-pane .archive-drawer { border-color: var(--border); }
    .library-pane :focus-visible { outline-color: var(--accent); }

    .workspace-grid.library-collapsed .library-pane { padding: 22px 12px; overflow: hidden; }
    .workspace-grid.library-collapsed .sidebar-brand {
      display: grid; justify-items: center; gap: 14px; padding: 0;
    }
    .workspace-grid.library-collapsed .sidebar-brand-lockup { display: grid; place-items: center; }
    .workspace-grid.library-collapsed .sidebar-wordmark { display: none; }
    .workspace-grid.library-collapsed .sidebar-mark { display: block; }
    .workspace-grid.library-collapsed .sidebar-toggle { width: 44px; min-height: 44px; }
    .workspace-grid.library-collapsed .sidebar-toggle svg { transform: rotate(180deg); }
    .workspace-grid.library-collapsed .pane-heading { display: grid; justify-items: center; margin-top: 14px; }
    .workspace-grid.library-collapsed .pane-heading > div,
    .workspace-grid.library-collapsed .document-list,
    .workspace-grid.library-collapsed .library-actions,
    .workspace-grid.library-collapsed .archive-drawer { display: none; }
    .workspace-grid.library-collapsed .new-essay {
      width: 44px; min-height: 44px; padding: 0; display: grid; place-items: center;
      color: var(--muted); background: transparent;
    }
    .workspace-grid.library-collapsed .new-essay svg { width: 18px; height: 18px; }
    .workspace-grid.library-collapsed .new-essay span {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .btn { border-radius: 6px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: color-mix(in oklch, var(--accent) 86%, var(--fg)); }
    .icon-button, .tag { border-radius: 6px; }
    .eyebrow { margin-bottom: 7px; }

    .writing-pane { height: 100vh; min-height: 0; overflow-y: auto; background: var(--surface); }
    .writing-header { max-width: 980px; padding: 104px 56px 30px; border: 0; }
    .writing-header-row { display: block; }
    .writing-header h1 {
      max-width: 24ch; font-size: clamp(28px, 2.4vw, 36px); line-height: 1.12;
      font-weight: 400; letter-spacing: -.025em;
    }
    .ownership-note {
      max-width: 52ch; margin-top: 12px; font-size: 11px;
      line-height: 1.6; text-align: left;
    }
    .writing-form { max-width: 980px; padding: 0 56px 88px; }
    .writing-form > .field:first-child {
      padding: 16px 0 22px; border: 0; border-block: 1px solid var(--border);
      border-radius: 0; background: transparent;
    }
    .field + .field { margin-top: 40px; }
    .input, .textarea { border-radius: 0; background: transparent; }
    .input { min-height: 78px; padding: 13px 0 0; border: 0; font-size: 13px; resize: none; }
    .textarea {
      min-height: 560px; padding: 24px 0; border: 0; resize: none;
      font-size: 21px; line-height: 2.08; letter-spacing: 0;
    }
    .input:hover, .textarea:hover { border-color: transparent; }
    .input:focus, .textarea:focus { border-color: transparent; outline: none; box-shadow: none; }
    .input:focus-visible, .textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .detection-panel { margin-top: 34px; padding-top: 24px; }
    .detection-header h2 { font-weight: 400; }
    .sentence-list { gap: 0; }
    .sentence-card {
      padding: 16px 0; border: 0; border-bottom: 1px solid var(--border);
      border-radius: 0; background: transparent;
    }
    .sentence-card:first-child { border-top: 1px solid var(--border); }
    .sentence-card.current { background: color-mix(in oklch, var(--surface) 55%, transparent); }

    .support-pane {
      height: 100vh; min-height: 0; overflow: auto;
      background: var(--bg); border-left: 1px solid var(--border);
    }
    .support-header { padding: 76px 28px 24px; background: var(--bg); }
    .support-header h2 { font-weight: 400; }
    .support-header .eyebrow { color: var(--accent); }
    .history { padding: 0 28px; background: var(--bg); }
    .history-list { gap: 14px; }
    .history-tab {
      min-width: 92px; min-height: 46px; padding: 8px 0;
      border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent;
    }
    .history-tab[aria-current="true"] { border-color: var(--fg); background: transparent; }
    .support-content { padding: 28px; }
    .loading-card, .error-card { border-radius: 7px; background: var(--bg); }
    .result-stack { gap: 26px; }
    .result-card, .feedback-card { border: 0; border-radius: 0; background: transparent; overflow: visible; }
    .result-card + .result-card { padding-top: 24px; border-top: 1px solid var(--fg); }
    .source-row { padding: 0 0 14px; }
    .direct-expression { padding: 18px 0 0; }
    .direct-expression strong { font-weight: 400; }
    .scaffold-list { padding: 0; }
    .scaffold-item {
      margin-top: 0; border: 0; border-bottom: 1px solid var(--border);
      border-radius: 0; background: transparent;
    }
    .scaffold-item:first-child { border-top: 1px solid var(--border); }
    .scaffold-item:hover, .scaffold-item.revealed, .scaffold-row:hover, .revealed-expression { background: var(--bg); }
    .feedback-card { padding: 20px 0 0; border-top: 1px solid var(--fg); }
    .export-button { background: transparent; }

    dialog { border-radius: 9px; }
    .prompt-card, .prompt-preview, .archive-row, .filter-button { border-radius: 6px; }

    @media (min-width: 1100px) and (max-width: 1359px) {
      .workspace-grid { grid-template-columns: 280px minmax(440px, 1fr) 340px; }
      .workspace-grid.library-collapsed { grid-template-columns: 72px minmax(520px, 1fr) 340px; }
      .library-pane { padding-inline: 18px; }
      .sidebar-wordmark { width: 180px; }
      .support-header, .history, .support-content { padding-inline: 22px; }
    }
    @media (max-width: 1099px) {
      body { overflow: auto; }
      .app-shell { height: auto; min-height: 100vh; display: block; }
      .topnav {
        position: sticky; top: 0; min-height: 56px; border-bottom: 1px solid var(--border);
        background: var(--bg); pointer-events: auto;
      }
      .topnav-inner { min-height: 56px; padding-inline: 20px; justify-content: space-between; }
      .topnav .brand-lockup { display: inline-flex; }
      .brand-mark { width: 30px; height: 30px; border-radius: 6px; }
      .mobile-switch { display: grid; top: 56px; }
      .workspace-grid, .workspace-grid.library-collapsed {
        display: block; height: auto; min-height: calc(100vh - 112px);
      }
      .library-pane, .writing-pane, .support-pane {
        display: none; height: auto; min-height: calc(100vh - 112px); overflow: visible;
      }
      body[data-mobile-view="library"] .library-pane,
      body[data-mobile-view="write"] .writing-pane,
      body[data-mobile-view="support"] .support-pane { display: block; }
      .library-pane, .workspace-grid.library-collapsed .library-pane { padding: 32px 24px 56px; }
      .sidebar-brand, .sidebar-toggle,
      .workspace-grid.library-collapsed .sidebar-brand { display: none; }
      .workspace-grid.library-collapsed .pane-heading { display: flex; justify-items: initial; margin-top: 0; }
      .workspace-grid.library-collapsed .pane-heading > div { display: block; }
      .workspace-grid.library-collapsed .document-list { display: grid; }
      .workspace-grid.library-collapsed .library-actions { display: flex; }
      .workspace-grid.library-collapsed .archive-drawer { display: block; }
      .workspace-grid.library-collapsed .new-essay { width: auto; min-height: 44px; padding: 8px 10px; display: inline-flex; }
      .workspace-grid.library-collapsed .new-essay span {
        position: static; width: auto; height: auto; padding: 0; margin: 0;
        overflow: visible; clip: auto; white-space: normal;
      }
      .document-list { margin-top: 12px; }
      .support-pane { border-left: 0; }
      .support-header { position: static; padding-top: 48px; }
    }
    @media (max-width: 767px) {
      .mobile-switch { padding-inline: 12px; background: var(--bg); }
      .writing-header { padding: 36px 20px 24px; }
      .writing-form { padding: 0 20px 56px; }
      .writing-form > .field:first-child { padding: 14px 0 18px; }
      .textarea { min-height: 440px; padding: 20px 0; font-size: 19px; line-height: 1.92; }
      .support-header { padding: 30px 20px 20px; }
      .support-content, .history { padding-inline: 20px; }
      .dialog-header { padding: 18px 18px 16px; }
      .dialog-body { padding: 16px 18px 20px; }
      .prompt-layout, .prompt-facts { grid-template-columns: 1fr; }
      .custom-actions { align-items: stretch; flex-direction: column; }
      .dialog-actions { padding: 14px 18px; flex-wrap: wrap; }
      .dialog-actions .btn { flex: 1 1 120px; }
    }
    @media (max-width: 420px) {
      .writing-header h1 { font-size: 28px; }
    }

    /* Scoped refinement: the writing column is a subject + body composer. */
    [data-od-id="writing-workspace"],
    [data-od-id="writing-workspace"] .textarea {
      scrollbar-width: none; -ms-overflow-style: none;
    }
    [data-od-id="writing-workspace"]::-webkit-scrollbar,
    [data-od-id="writing-workspace"] .textarea::-webkit-scrollbar { display: none; }
    [data-od-id="writing-workspace"]::selection,
    [data-od-id="writing-workspace"] *::selection {
      color: var(--fg); background: color-mix(in oklch, var(--accent) 24%, var(--surface));
    }
    [data-od-id="writing-workspace"] .writing-header[hidden] { display: none; }
    [data-od-id="writing-workspace"] .writing-form {
      max-width: 900px; margin-inline: auto; padding: 76px 64px 100px;
    }
    [data-od-id="writing-workspace"] .writing-form > .field:first-child {
      padding: 0 0 28px; border: 0; border-bottom: 1px solid var(--border);
    }
    [data-od-id="writing-workspace"] .field + .field { margin-top: 32px; }
    [data-od-id="writing-workspace"] .field label {
      color: var(--muted); font: 600 11px/1.3 var(--font-body); letter-spacing: .04em;
    }
    [data-od-id="writing-workspace"] .source-meta,
    [data-od-id="writing-workspace"] .field-meta { font-size: 10px; }
    [data-od-id="writing-workspace"] .input {
      min-height: 92px; padding: 14px 0 0; resize: none;
      font: 400 18px/1.7 var(--font-display); letter-spacing: 0;
    }
    [data-od-id="writing-workspace"] .essay-editor-shell { position: relative; }
    [data-od-id="writing-workspace"] .textarea {
      min-height: clamp(520px, 60vh, 760px); padding: 20px 52px 44px 0;
      overflow-y: auto; font: 400 18px/1.9 var(--font-display); caret-color: var(--accent);
    }
    [data-od-id="writing-workspace"] .essay-mirror {
      position: absolute; inset: 0 auto auto 0; visibility: hidden; pointer-events: none;
      white-space: pre-wrap; overflow-wrap: anywhere; border: 0; background: transparent;
    }
    [data-od-id="writing-workspace"] .inline-detections {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    }
    [data-od-id="writing-workspace"] .inline-detection-button {
      position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 7px;
      display: grid; place-items: center; border: 0; background: transparent;
      color: var(--muted); pointer-events: auto;
    }
    [data-od-id="writing-workspace"] .inline-detection-button svg {
      width: 30px; height: 30px; padding: 7px; overflow: visible;
      border: 1px solid var(--border); border-radius: 50%; background: var(--bg);
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    [data-od-id="writing-workspace"] .inline-detection-button:hover:not(:disabled) svg,
    [data-od-id="writing-workspace"] .inline-detection-button:focus-visible svg,
    [data-od-id="writing-workspace"] .inline-detection-button[aria-current="true"] svg {
      border-color: var(--accent); background: var(--accent-soft); color: var(--accent);
    }
    [data-od-id="writing-workspace"] .inline-detection-button:disabled { opacity: .46; }
    [data-od-id="writing-workspace"] .inline-detection-button[hidden] { display: none; }

    @media (min-width: 1100px) and (max-width: 1359px) {
      [data-od-id="writing-workspace"] .writing-form { padding-inline: 32px; }
    }

    @media (max-width: 767px) {
      [data-od-id="writing-workspace"] .writing-form { padding: 30px 20px 64px; }
      [data-od-id="writing-workspace"] .writing-form > .field:first-child { padding-bottom: 22px; }
      [data-od-id="writing-workspace"] .input { min-height: 104px; font-size: 16px; }
      [data-od-id="writing-workspace"] .textarea {
        min-height: 480px; padding: 18px 48px 36px 0; font-size: 17px; line-height: 1.85;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

        announce("本地内容恢复失败。已载入演示内容，尚未保存。");
      }
      setLibraryCollapsed(initialSidebarCollapsed,false);
      console.assert(document.getElementById("content").classList.contains("library-collapsed") === (document.querySelector('[data-action="toggle-library"]').getAttribute("aria-expanded") === "false"),"侧栏收放状态无效");
      refresh(true);
    }());
  </script>
</body>
