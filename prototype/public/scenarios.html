<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinguaType 测试场景</title><body style="max-width:760px;margin:60px auto;padding:24px;font:16px/1.8 sans-serif;background:#faf9f6;color:#34322d"><a href="/">← 写作工作台</a><h1>预制测试场景</h1><p>所有响应来自已有演示样例或已保存测试结果。未收录的输入会提示失败，正文仍然保留。</p><h2>表达支架与全文反馈</h2><p>选择公共服务数字化文章，点击中文卡点查看支架。全文反馈使用该文章的原始演示正文；自行改写后不冒充重新评阅。</p><h2>定稿与素材</h2><p>公共服务文章可在保留原始正文时体验定稿和素材确认；已保存的素材可以在“我的素材”中追溯来源。</p><h2>积累召回</h2><p><a href="/?demo=recall">打开三场景</a>：大学服务线上化有匹配、仅改网站装饰配色无匹配、太空探索与艺术资助无匹配。结果按预制场景读取，不实时判断相似度。</p><p>操作保存在浏览器隔离演示区。预制数据不代表真实用户学习效果。</p></body></html>
